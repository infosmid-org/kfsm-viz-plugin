plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    alias(libs.plugins.maven.publish)
    alias(libs.plugins.gradle.plugin.publish)
    alias(libs.plugins.asciidoctor)
}

group = 'org.infosmid.plugins'
def getVersionFromFile() {
    return new File(rootProject.projectDir, 'version.txt').text.trim()
}
version = providers.gradleProperty('releaseVersion').getOrNull() ?: getVersionFromFile()
def projectName = 'KFSM Visualization plugin'
def projectDescription = 'KFSM Visualization plugin for plantuml and asciidoc'
description = projectDescription

repositories {
    mavenLocal()
    mavenCentral()
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

gradlePlugin {
    website.set('https://github.com/infosmid-org/kfsm-viz-plugin')
    vcsUrl.set('https://github.com/infosmid-org/kfsm-viz-plugin')
    plugins {
        register('kfsmVizPlugin') {
            id = 'org.infosmid.plugins.kfsm-viz'
            implementationClass = 'org.infosmid.plugins.kfsm_viz.VizPlugin'
            displayName = projectName
            description = projectDescription
            tags.set(['fsm', 'kotlin', 'plantuml', 'mermaid', 'state-diagram', 'asciidoc', 'visualize'])
        }
    }
}

dependencies {
    implementation libs.kfsm.viz
    testImplementation libs.junit
    testImplementation libs.assertj.core
    testImplementation gradleTestKit()
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/infosmid-org/${rootProject.name}")
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').getOrElse('')
                password = providers.environmentVariable('GITHUB_TOKEN').getOrElse('')
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
        signAllPublications()
    }
    coordinates(project.group.toString(), rootProject.name, project.version.toString())
    pom {
        name = projectName
        description = projectDescription
        inceptionYear = '2020'
        url = "https://github.com/infosmid-org/${rootProject.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'corneil'
                name = 'Corneil du Plessis'
                url = 'https://github.com/corneil'
            }
        }
        scm {
            url = "https://github.com/infosmid-org/${rootProject.name}"
            connection = "scm:git:git://github.com/infosmid-org/${rootProject.name}.git"
            developerConnection = "scm:git:ssh://git@github.com/infosmid-org/${rootProject.name}.git"
        }
        issueManagement {
            system = 'GitHub'
            url = "https://github.com/infosmid-org/${rootProject.name}/issues"
        }
    }
}

tasks.named('test') {
    useJUnit()
    testLogging { exceptionFormat = 'full' }
}

// User guide is README.adoc rendered as index.html
// Stage README.adoc with the generated diagrams it includes, so the source dir overlaps no other task output
def guideSrc = layout.buildDirectory.dir('guide-src')
def guideSrcTask = tasks.register('guideSrc', Sync) {
    from(projectDir) { include 'README.adoc' }
    from(projectDir) {
        include 'output/generated/**'
    }
    into guideSrc
}

asciidoc {
    publications {
        main {
            sourceSet {
                sourceDir = guideSrc.get().asFile.path
                sources {
                    include 'README.adoc'
                }
                attributes {
                    addAll 'toc': 'left',
                        'idprefix': '',
                        'idseparator': '-'
                }
                missingIncludesAreFatal()
            }
            output 'asciidoctorj', 'html'
        }
    }
}

tasks.named('asciidoctorHtml') {
    dependsOn guideSrcTask
}

// README.adoc references the root *.svg files; the guide needs them next to index.html
tasks.register('siteDocsGuide', Sync) {
    from(tasks.named('asciidoctorHtml')) {
        include 'README.html'
        rename 'README.html', 'index.html'
    }
    from(projectDir) { include '*.svg' }
    into layout.buildDirectory.dir('site-docs/guide')
}

// Properties read by gradle/site-docs.gradle (siteDocsZip); must be set before it is applied.
ext {
    siteDocsTitle       = projectName
    siteDocsSummary     = projectDescription
    siteDocsGuideTask   = 'siteDocsGuide'
    siteDocsApiTask     = 'groovydoc'
    siteDocsPublication = 'pluginMaven'
    siteDocsArtifactId  = rootProject.name
    siteDocsGroupId     = 'org.infosmid'
    siteDocsTags        = ['Gradle', 'Kotlin', 'FSM', 'PlantUML', 'Asciidoc', 'Mermaid']
    siteDocsLicense     = 'Apache-2.0'
    siteDocsSourceUrl   = "https://github.com/infosmid-org/${rootProject.name}".toString()
}
apply from: "$rootProject.projectDir/gradle/site-docs.gradle"
